# Agente_GCP — golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gosec

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/richard/agente-gcp
  revive:
    rules:
      - name: exported
        severity: warning
      - name: package-comments
        severity: warning
  gosec:
    excludes:
      - G101  # Potential hardcoded credentials (we use env vars)

run:
  timeout: 3m
  modules-download-mode: readonly
  issues-exit-code: 1

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 50
  max-same-issues: 3
